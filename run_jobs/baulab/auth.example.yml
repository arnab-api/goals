# run_jobs/baulab auth — copy this to auth.yml (gitignored) and fill it in.
#
# This file keeps the baulab scheduler self-contained: credentials live next to the
# module, not in the project-root env.yml.

# SSH username used for all remote workers (user@host).
BAULAB_USER: your_username

# ssh_login: true  -> use passwordless ssh (keys / ssh-agent) for every target host.
#                     BAULAB_PASS is then ignored and not required — you must have
#                     key-based login working for each remote box (test: `ssh <host> true`).
# ssh_login: false -> use sshpass with BAULAB_PASS below.
ssh_login: false

# Only needed when ssh_login is false.
BAULAB_PASS: your_password
