[project]
name = "goals"
version = "0.1.0"
description = "Goal encoding in LLMs: goal-head localization, GoalScope readouts and NRGS interventions."
requires-python = ">=3.11"
dependencies = [
    # core ML / interpretability
    "torch>=2.7",
    "torchvision",
    "transformers>=5.17",
    "accelerate",
    "nnsight>=0.8.2",
    # standardized module names / values over nnsight 0.8
    "nnterp",  # pinned to a v2.0.0 commit in [tool.uv.sources] until a release carries #124, #127 and #128
    "peft",  # the EM adapter of scripts/em/, which nnsight's `load_adapter` attaches
    "datasets",
    "huggingface-hub",
    "safetensors",
    "tokenizers",
    "sentencepiece",
    "circuitsvis>=1.43.3",  # attention viz used by src.nrgs.functional
    # scientific stack
    "numpy",
    "pandas",
    "matplotlib",
    # notebook / dev tools
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "nbformat",
    "nbconvert",
    "rich",
    "tqdm",
    "pyyaml",
    # API clients (LM judges)
    "anthropic",
    # project utility libraries
    "dataclasses-json",
]

[tool.uv]
# The code is imported via `sys.path.append(".")` (e.g. `from src.models import ...`),
# not installed as a distribution — so don't try to build/install this project itself,
# just resolve its dependencies into the venv.
package = false
# Resolve for Linux only. uv's universal resolver would otherwise try to satisfy every
# platform (incl. win32/macOS), where the CUDA torch wheels don't exist — that split is
# unsatisfiable and aborts the whole resolution. This project is Linux + CUDA only.
environments = ["sys_platform == 'linux'"]
# The nnsight git pin below reports an rc version (setuptools-scm counts from v0.8.0.rc1, the last tag on nnsight's
# dev branch: 0.8.0rc2.dev236+ge09ab1c8), which sorts below this project's `nnsight>=0.8.2` and nnterp's
# `nnsight>=0.8`. The override relaxes those constraints so the pin resolves; delete it with the pin.
override-dependencies = ["nnsight>=0.8.0rc1"]

[tool.uv.sources]
# nnsight's dev branch at e09ab1c8 (carries #824, the PEFT adapter switch); move to the 0.8.3 release when it exists.
nnsight = { git = "https://github.com/ndif-team/nnsight", rev = "e09ab1c82139e00363c4271464a62e253df1bb8e" }
# nnterp: the v2.0.0 commit that carries ndif-team/nnterp#124 (the config read honours `cache_dir`), #127
# (`self_attn.interface`) and #128 (`attention_queries_prerope` / `attention_keys_prerope`, `self_attn.rotate`); pinned
# until a release has them.
nnterp = { git = "https://github.com/ndif-team/nnterp", rev = "3fb2cc02b853c0c444e64b8cf75a7743b6f1e661" }
# PyTorch from the CUDA 12.8 wheel index (see [[tool.uv.index]] below). To switch CUDA
# versions, change the index url AND this name to match (e.g. pytorch-cu126 / cu121).
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# Dedicated CUDA wheel index for torch/torchvision only (`explicit = true` keeps every
# other package on PyPI). CUDA 12.x drivers must be installed on the host. cu128 matches
# the reference environment (torch 2.10 / CUDA 12.8); note cu124 caps at torch 2.6.0, so
# it cannot satisfy torch>=2.7.
#   CUDA 12.1 -> https://download.pytorch.org/whl/cu121
#   CUDA 12.4 -> https://download.pytorch.org/whl/cu124   (torch <= 2.6.0)
#   CUDA 12.6 -> https://download.pytorch.org/whl/cu126
#   CUDA 12.8 -> https://download.pytorch.org/whl/cu128
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff.lint.per-file-ignores]
# Notebooks import the project via `sys.path.append("../..")`, which has to run BEFORE the
# `src.*` / `scripts.*` imports — so the import block is legitimately split and out of order.
# Ruff's defaults flag that on every notebook; silence the three rules the idiom guarantees.
#   E402  module-level import not at top of file  (the sys.path.append sits above them)
#   I001  un-sorted / un-formatted import block   (same cause; also fights organizeImports-on-save)
#   F401  imported but unused                     (a cell may import for a later cell, or for %autoreload)
"*.ipynb" = ["E402", "I001", "F401"]
