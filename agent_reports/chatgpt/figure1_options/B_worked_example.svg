<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="925" viewBox="0 0 1500 925" role="img" aria-labelledby="title"><title id="title">DIFF Figure 1 concept B: worked example and two causal interventions</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202b3b"/></marker><marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#267b9b"/></marker><marker id="arrow-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#956327"/></marker><marker id="arrow-goal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7960ad"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#202b3b">(a)  The next subgoal is what remains to be done</text>
<rect x="28" y="65" width="465" height="102" rx="10" fill="#fcf5e9" stroke="#956327"/>
<text x="44" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="700" fill="#956327">TASK REQUIREMENTS · K,V</text>
<text x="44" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words that are palindromes</text>
<text x="44" y="149" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">and start with a vowel.</text>
<rect x="28" y="185" width="465" height="155" rx="10" fill="#edf7fa" stroke="#267b9b"/>
<text x="45" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="700" fill="#267b9b">CODE SO FAR · PROGRESS</text>
<text x="45" y="244" font-family="DejaVu Sans Mono, monospace" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">res = [w for w in words</text>
<text x="45" y="271" font-family="DejaVu Sans Mono, monospace" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">       if w == w[::-1]]</text>
<text x="45" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" xml:space="preserve" font-weight="700" fill="#7960ad">▸</text>
<text x="72" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="400" fill="#647184">Pivot: before the next computation</text>
<path d="M493,115 L625,115 L625,191 L679,191" fill="none" stroke="#956327" stroke-width="2.2" marker-end="url(#arrow-kv)"/>
<text x="525" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#956327">K,V</text>
<path d="M493,266 L625,266 L625,226 L679,226" fill="none" stroke="#267b9b" stroke-width="2.2" marker-end="url(#arrow-q)"/>
<text x="533" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#267b9b">Q</text>
<rect x="682" y="166" width="185" height="84" rx="10" fill="white" stroke="#202b3b"/>
<text x="735" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" xml:space="preserve" font-weight="700" fill="#202b3b">DIFF</text>
<text x="702" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="400" fill="#647184">attention read</text>
<path d="M867,208 L947,208 L947,118 L979,118" fill="none" stroke="#7960ad" stroke-width="2.2" marker-end="url(#arrow-goal)"/>
<text x="878" y="233" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" xml:space="preserve" font-weight="400" fill="#7960ad">head</text>
<text x="878" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" xml:space="preserve" font-weight="400" fill="#7960ad">output</text>
<rect x="981" y="76" width="490" height="76" rx="10" fill="#f3effa" stroke="#7960ad"/>
<text x="997" y="101" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="700" fill="#7960ad">SELECTED NEXT SUBGOAL</text>
<text x="997" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" xml:space="preserve" font-weight="700" fill="#7960ad">Keep vowel-initial words</text>
<path d="M1226,153 L1226,178 L1060,178 L1060,196" fill="none" stroke="#7960ad" stroke-width="2.2" marker-end="url(#arrow-goal)"/>
<path d="M1226,178 L963,178 L963,303 L978,303" fill="none" stroke="#7960ad" stroke-width="2.2" marker-end="url(#arrow-goal)"/>
<rect x="980" y="203" width="491" height="48" rx="10" fill="white" stroke="#dce2e9"/>
<text x="997" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="400" fill="#7960ad">GoalScope: “Keep vowel-initial words.”</text>
<rect x="980" y="272" width="491" height="68" rx="10" fill="#f8fafc" stroke="#dce2e9"/>
<text x="997" y="300" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">return [w for w in res</text>
<text x="997" y="325" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">        if w[0] in &quot;aeiou&quot;]</text>
<path d="M28,373 L1471,373" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="28" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#202b3b">Two interventions test the inputs to this selection</text>
<text x="28" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#202b3b">(b)  Change progress</text>
<text x="28" y="491" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#647184">Hold task requirements fixed</text>
<rect x="28" y="513" width="695" height="101" rx="10" fill="#edf7fa" stroke="#267b9b"/>
<text x="46" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="700" fill="#267b9b">DONOR CONTEXT</text>
<text x="46" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" xml:space="preserve" font-weight="400" fill="#202b3b">Vowel filter implemented</text>
<text x="46" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="400" fill="#647184">Same task: palindromes AND vowel-initial words</text>
<path d="M375,614 L375,672" fill="none" stroke="#267b9b" stroke-width="2" marker-end="url(#arrow-q)" stroke-dasharray="6 5"/>
<text x="393" y="651" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#267b9b">transplant Q</text>
<rect x="28" y="688" width="695" height="76" rx="10" fill="#f3effa" stroke="#7960ad"/>
<text x="44" y="713" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="700" fill="#7960ad">SELECTED NEXT SUBGOAL</text>
<text x="44" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" xml:space="preserve" font-weight="700" fill="#7960ad">Keep palindromes</text>
<text x="46" y="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#202b3b">Clean next goal: vowel  →  Patched: palindrome</text>
<text x="46" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#647184">Destination keeps its own task K,V.</text>
<text x="775" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#202b3b">(c)  Change requirements</text>
<text x="775" y="491" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#647184">Hold completed work fixed</text>
<rect x="775" y="513" width="695" height="101" rx="10" fill="#fcf5e9" stroke="#956327"/>
<text x="793" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="700" fill="#956327">DONOR CONTEXT</text>
<text x="793" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" xml:space="preserve" font-weight="400" fill="#202b3b">Task: palindromes AND words longer than 3</text>
<text x="793" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="400" fill="#647184">Same progress: palindrome filter already implemented</text>
<path d="M1122,614 L1122,672" fill="none" stroke="#956327" stroke-width="2" marker-end="url(#arrow-kv)" stroke-dasharray="6 5"/>
<text x="1140" y="651" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#956327">transplant K,V</text>
<rect x="775" y="688" width="695" height="76" rx="10" fill="#f3effa" stroke="#7960ad"/>
<text x="791" y="713" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="700" fill="#7960ad">SELECTED NEXT SUBGOAL</text>
<text x="791" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" xml:space="preserve" font-weight="700" fill="#7960ad">Keep words longer than 3</text>
<text x="793" y="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#202b3b">Clean next goal: vowel  →  Patched: length &gt; 3</text>
<text x="793" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#647184">Destination retains its progress context.</text>
<text x="28" y="903" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">SCHEMATIC EXAMPLES · Text summarizes interventions; arrows do not specify patch duration or layer count.</text>
</svg>