<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title"><title id="title">DIFF: labeled interventions and their aligned effects on one destination</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202b3b"/></marker><marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#267b9b"/></marker><marker id="arrow-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#956327"/></marker><marker id="arrow-goal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7960ad"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow-clean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38745d"/></marker></defs>
<text x="28" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" xml:space="preserve" font-weight="700" fill="#202b3b">DIFF: two interventions on the same destination</text>
<text x="28" y="73" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#647184">(a) → (b): replace task K,V.     (c) → (d): replace progress Q.     Dashed: transplant. Solid: resulting continuation.</text>
<text x="28" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#956327">(a) Task / goal transfer</text>
<text x="28" y="158" font-family="DejaVu Serif,serif" font-size="25" fill="#956327" xml:space="preserve">(K,V)<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← (K,V)<tspan baseline-shift="sub" font-size="70%">src_kv</tspan></text>
<rect x="28" y="181" width="550" height="341" rx="8" fill="white" stroke="#956327"/>
<text x="46" y="212" font-family="DejaVu Serif,serif" font-size="25" fill="#956327" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">src_kv</tspan></text>
<text x="188" y="211" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#956327">TASK DONOR</text>
<text x="46" y="249" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">3</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>}</text>
<path d="M44,265 L562,265" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="46" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<rect x="40" y="301" width="526" height="60" rx="3" fill="#fcf5e9" stroke="#956327"/>
<text x="47" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="47" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₃: the word has &gt;1 unique characters</text>
<text x="46" y="388" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="46" y="415" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="46" y="442" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w == w[::-1]]</text>
<text x="46" y="483" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="335.572" y="464" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="338.572" y="483" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="46" y="510" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<text x="47" y="554" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#956327">Different task set; shared progress {T₁}</text>
<text x="28" y="632" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" xml:space="preserve" font-weight="700" fill="#267b9b">(c) Progress transfer</text>
<text x="28" y="668" font-family="DejaVu Serif,serif" font-size="25" fill="#267b9b" xml:space="preserve">q<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← q<tspan baseline-shift="sub" font-size="70%">src_q</tspan></text>
<rect x="28" y="691" width="550" height="341" rx="8" fill="white" stroke="#267b9b"/>
<text x="46" y="722" font-family="DejaVu Serif,serif" font-size="25" fill="#267b9b" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">src_q</tspan></text>
<text x="188" y="721" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#267b9b">QUERY DONOR</text>
<text x="46" y="759" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">2</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">2</tspan>}</text>
<path d="M44,775 L562,775" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="46" y="802" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<text x="47" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="47" y="861" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₂: the word starts with a vowel</text>
<text x="46" y="898" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="46" y="925" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="46" y="952" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w[0] in &quot;aeiou&quot;]</text>
<text x="46" y="993" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="335.572" y="974" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="338.572" y="993" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="46" y="1020" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<text x="47" y="1062" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="700" fill="#267b9b">Same task set; different progress {T₂}</text>
<rect x="738" y="440" width="550" height="341" rx="8" fill="white" stroke="#202b3b"/>
<text x="756" y="471" font-family="DejaVu Serif,serif" font-size="25" fill="#202b3b" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">dst</tspan></text>
<text x="898" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#202b3b">SHARED DESTINATION</text>
<text x="756" y="508" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">2</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>}</text>
<path d="M754,524 L1272,524" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="756" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<rect x="750" y="560" width="526" height="60" rx="3" fill="#fcf5e9" stroke="#956327"/>
<text x="757" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="757" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₂: the word starts with a vowel</text>
<text x="756" y="647" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="756" y="674" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="756" y="701" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w == w[::-1]]</text>
<text x="756" y="742" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="1045.5720000000001" y="723" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="1048.5720000000001" y="742" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="756" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<path d="M566,331 L649,331 L649,590 L750,590" fill="none" stroke="#956327" stroke-width="2.2" marker-end="url(#arrow-kv)" stroke-dasharray="6 5"/>
<path d="M367.572,987 L605,987 L605,1083 L1060.5720000000001,1083 L1060.5720000000001,752" fill="none" stroke="#267b9b" stroke-width="2.2" marker-end="url(#arrow-q)" stroke-dasharray="6 5"/>
<rect x="699" y="571" width="39" height="29" rx="4" fill="#fcf5e9" stroke="#956327"/>
<text x="704" y="592" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#956327">(a)</text>
<rect x="1106" y="721" width="39" height="29" rx="4" fill="#edf7fa" stroke="#267b9b"/>
<text x="1111" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#267b9b">(c)</text>
<rect x="738" y="142" width="550" height="183" rx="7" fill="#eff7f2" stroke="#38745d"/>
<text x="754" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#38745d">Clean run</text>
<text x="754" y="207" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>)</text>
<path d="M752,224 L1274,224" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="754" y="255" font-family="DejaVu Serif,serif" font-size="23" fill="#38745d" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">2</tspan>  vowel-initial</text>
<text x="754" y="293" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">w[0] in &quot;aeiou&quot;]</text>
<path d="M1013,440 L1013,334" fill="none" stroke="#38745d" stroke-width="2" marker-end="url(#arrow-clean)"/>
<text x="1032" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#38745d">No patch</text>
<path d="M1276,590 L1328,590 L1328,341 L1380,341" fill="none" stroke="#956327" stroke-width="2.2" marker-end="url(#arrow-kv)"/>
<text x="1409" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#956327">Effect of (a)</text>
<rect x="1394" y="250" width="478" height="183" rx="7" fill="#fcf5e9" stroke="#956327"/>
<text x="1410" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#956327">(b) K/V-patched run</text>
<text x="1410" y="315" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>) [(K,V)<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← (K,V)<tspan baseline-shift="sub" font-size="70%">src_kv</tspan>]</text>
<path d="M1408,332 L1858,332" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="1410" y="363" font-family="DejaVu Serif,serif" font-size="23" fill="#956327" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">3</tspan>  &gt;1 unique characters</text>
<text x="1410" y="401" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">len(set(w)) &gt; 1]</text>
<path d="M1077.5720000000001,736 L1093,736 L1093,767 L1348,767 L1348,852 L1380,852" fill="none" stroke="#267b9b" stroke-width="2.2" marker-end="url(#arrow-q)"/>
<text x="1409" y="736" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="700" fill="#267b9b">Effect of (c)</text>
<rect x="1394" y="761" width="478" height="183" rx="7" fill="#edf7fa" stroke="#267b9b"/>
<text x="1410" y="789" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#267b9b">(d) Query-patched run</text>
<text x="1410" y="826" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>) [q<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← q<tspan baseline-shift="sub" font-size="70%">src_q</tspan>]</text>
<path d="M1408,843 L1858,843" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="1410" y="874" font-family="DejaVu Serif,serif" font-size="23" fill="#267b9b" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">1</tspan>  palindrome</text>
<text x="1410" y="912" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">w == w[::-1]]</text>
<text x="754" y="846" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="400" fill="#647184">One destination prompt.</text>
<text x="754" y="877" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" xml:space="preserve" font-weight="400" fill="#647184">Two separate patched runs.</text>
<text x="28" y="1115" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="400" fill="#647184">Schematic continuations · Each patch is applied separately to the same p_dst; the destination text is never replaced.</text>
<text x="28" y="1141" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">G: task set; P: completed work; π: pivot. Nonempty lowercase words assumed. Arrows identify activation sites; patch settings belong in the caption.</text>
</svg>