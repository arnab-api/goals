<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="955" viewBox="0 0 1800 955" role="img" aria-labelledby="title"><title id="title">DIFF: two donors, one destination, three continuations</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202b3b"/></marker><marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#267b9b"/></marker><marker id="arrow-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#956327"/></marker><marker id="arrow-goal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7960ad"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" xml:space="preserve" font-weight="700" fill="#202b3b">Two interventions, one destination prompt</text>
<text x="28" y="73" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#647184">Change the progress query or the task keys/values to change which condition the model implements next.</text>
<rect x="28" y="153" width="550" height="341" rx="8" fill="white" stroke="#267b9b"/>
<text x="46" y="184" font-family="DejaVu Serif,serif" font-size="25" fill="#267b9b" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">src_q</tspan></text>
<text x="188" y="183" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#267b9b">QUERY DONOR</text>
<text x="46" y="221" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">2</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">2</tspan>}</text>
<path d="M44,237 L562,237" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="46" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<text x="47" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="47" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₂: the word starts with a vowel</text>
<text x="46" y="360" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="46" y="387" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="46" y="414" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w[0] in &quot;aeiou&quot;]</text>
<text x="46" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="335.572" y="436" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="338.572" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="46" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<rect x="625" y="153" width="550" height="341" rx="8" fill="white" stroke="#202b3b"/>
<text x="643" y="184" font-family="DejaVu Serif,serif" font-size="25" fill="#202b3b" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">dst</tspan></text>
<text x="785" y="183" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#202b3b">SHARED DESTINATION</text>
<text x="643" y="221" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">2</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>}</text>
<path d="M641,237 L1159,237" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="643" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<rect x="637" y="273" width="526" height="60" rx="3" fill="#fcf5e9" stroke="#956327"/>
<text x="644" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="644" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₂: the word starts with a vowel</text>
<text x="643" y="360" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="643" y="387" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="643" y="414" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w == w[::-1]]</text>
<text x="643" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="932.572" y="436" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="935.572" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="643" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<rect x="1222" y="153" width="550" height="341" rx="8" fill="white" stroke="#956327"/>
<text x="1240" y="184" font-family="DejaVu Serif,serif" font-size="25" fill="#956327" xml:space="preserve">p<tspan baseline-shift="sub" font-size="70%">src_kv</tspan></text>
<text x="1382" y="183" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="700" fill="#956327">TASK DONOR</text>
<text x="1240" y="221" font-family="DejaVu Serif,serif" font-size="21" fill="#202b3b" xml:space="preserve">G = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>, T<tspan baseline-shift="sub" font-size="70%">3</tspan>}    P = {T<tspan baseline-shift="sub" font-size="70%">1</tspan>}</text>
<path d="M1238,237 L1756,237" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="1240" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">Keep words satisfying both conditions:</text>
<rect x="1234" y="273" width="526" height="60" rx="3" fill="#fcf5e9" stroke="#956327"/>
<text x="1241" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₁: the word is a palindrome</text>
<text x="1241" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="400" fill="#202b3b">T₃: the word has &gt;1 unique characters</text>
<text x="1240" y="360" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">def func(words: list[str]):</text>
<text x="1240" y="387" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    res = [w for w in words</text>
<text x="1240" y="414" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">           if w == w[::-1]]</text>
<text x="1240" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#202b3b">    return [w for w in res </text>
<rect x="1529.5720000000001" y="436" width="30" height="26" rx="3" fill="#edf7fa" stroke="#267b9b"/>
<text x="1532.5720000000001" y="455" font-family="DejaVu Sans Mono, monospace" font-size="18" xml:space="preserve" font-weight="400" fill="#267b9b">if</text>
<text x="1240" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">π: final token of the prompt</text>
<path d="M1234,303 L1163,303" fill="none" stroke="#956327" stroke-width="2.2" marker-end="url(#arrow-kv)" stroke-dasharray="6 5"/>
<text x="1310" y="125" font-family="DejaVu Serif,serif" font-size="18" fill="#956327" xml:space="preserve">G<tspan baseline-shift="sub" font-size="70%">src_kv</tspan> ≠ G<tspan baseline-shift="sub" font-size="70%">dst</tspan>; P<tspan baseline-shift="sub" font-size="70%">src_kv</tspan> = P<tspan baseline-shift="sub" font-size="70%">dst</tspan></text>
<text x="55" y="125" font-family="DejaVu Serif,serif" font-size="18" fill="#267b9b" xml:space="preserve">G<tspan baseline-shift="sub" font-size="70%">src_q</tspan> = G<tspan baseline-shift="sub" font-size="70%">dst</tspan>; P<tspan baseline-shift="sub" font-size="70%">src_q</tspan> ≠ P<tspan baseline-shift="sub" font-size="70%">dst</tspan></text>
<path d="M350.572,465 L350.572,540 L947.572,540 L947.572,465" fill="none" stroke="#267b9b" stroke-width="2.2" marker-end="url(#arrow-q)" stroke-dasharray="6 5"/>
<text x="515" y="531" font-family="DejaVu Serif,serif" font-size="23" fill="#267b9b" xml:space="preserve">q<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← q<tspan baseline-shift="sub" font-size="70%">src_q</tspan></text>
<text x="1244" y="533" font-family="DejaVu Serif,serif" font-size="23" fill="#956327" xml:space="preserve">(K,V)<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← (K,V)<tspan baseline-shift="sub" font-size="70%">src_kv</tspan></text>
<text x="28" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" xml:space="preserve" font-weight="700" fill="#202b3b">Read the same destination under three conditions</text>
<path d="M1175,470 L1205,470" fill="none" stroke="#202b3b" stroke-width="2"/>
<path d="M1205,470 L1205,628" fill="none" stroke="#202b3b" stroke-width="2"/>
<path d="M310,628 L1490,628" fill="none" stroke="#202b3b" stroke-width="2"/>
<path d="M303,628 L303,655" fill="none" stroke="#202b3b" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="28" y="666" width="550" height="183" rx="7" fill="#eff7f2" stroke="#38745d"/>
<text x="44" y="694" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#38745d">Clean run</text>
<text x="44" y="731" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>)</text>
<path d="M42,748 L564,748" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="44" y="779" font-family="DejaVu Serif,serif" font-size="23" fill="#38745d" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">2</tspan>  vowel-initial</text>
<text x="44" y="817" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">w[0] in &quot;aeiou&quot;]</text>
<path d="M900,628 L900,655" fill="none" stroke="#202b3b" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="625" y="666" width="550" height="183" rx="7" fill="#edf7fa" stroke="#267b9b"/>
<text x="641" y="694" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#267b9b">Query-patched run</text>
<text x="641" y="731" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>) [q<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← q<tspan baseline-shift="sub" font-size="70%">src_q</tspan>]</text>
<path d="M639,748 L1161,748" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="641" y="779" font-family="DejaVu Serif,serif" font-size="23" fill="#267b9b" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">1</tspan>  palindrome</text>
<text x="641" y="817" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">w == w[::-1]]</text>
<path d="M1497,628 L1497,655" fill="none" stroke="#202b3b" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="1222" y="666" width="550" height="183" rx="7" fill="#fcf5e9" stroke="#956327"/>
<text x="1238" y="694" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#956327">K/V-patched run</text>
<text x="1238" y="731" font-family="DejaVu Serif,serif" font-size="20" fill="#202b3b" xml:space="preserve">M(p<tspan baseline-shift="sub" font-size="70%">dst</tspan>) [(K,V)<tspan baseline-shift="sub" font-size="70%">dst</tspan> ← (K,V)<tspan baseline-shift="sub" font-size="70%">src_kv</tspan>]</text>
<path d="M1236,748 L1758,748" fill="none" stroke="#dce2e9" stroke-width="2"/>
<text x="1238" y="779" font-family="DejaVu Serif,serif" font-size="23" fill="#956327" xml:space="preserve">T<tspan baseline-shift="sub" font-size="70%">3</tspan>  &gt;1 unique characters</text>
<text x="1238" y="817" font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" font-weight="400" fill="#202b3b">len(set(w)) &gt; 1]</text>
<text x="28" y="900" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="400" fill="#647184">Schematic continuations · Each patch is applied separately to the same p_dst; the destination text is never replaced.</text>
<text x="28" y="926" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" xml:space="preserve" font-weight="400" fill="#647184">G: task set; P: completed work; π: pivot. Nonempty lowercase words assumed. Arrows identify activation sites; patch settings belong in the caption.</text>
</svg>