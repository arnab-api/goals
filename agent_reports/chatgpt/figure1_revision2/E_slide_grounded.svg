<text x="28" y="1190" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" xml:space="preserve" font-weight="700" fill="#202b3b">Q carries which work is done; task K,V supplies what is required. The resulting read selects the next subgoal.</text>
<text x="28" y="1230" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="400" fill="#647184">Source: goal-diff.pdf, slides 3 and 5. Prompt excerpts are shortened; readouts are summarized; output excerpts preserve the reported expressions.</text>
<text x="28" y="1256" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" xml:space="preserve" font-weight="400" fill="#647184">Query arrow marks the prefill sites; the slide also reports repeated decode patching. K,V replaces the destination task span, not its code prefix.</text>
