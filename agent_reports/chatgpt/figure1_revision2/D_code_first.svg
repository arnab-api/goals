<text x="28" y="39" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" xml:space="preserve" font-weight="700" fill="#202b3b">DIFF: task requirements and completed code determine the next subgoal</text>
<text x="28" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" xml:space="preserve" font-weight="400" fill="#647184">Boxed token = query site at the pivot. Shaded instruction = task K,V span. Dashed arrow = activation transplant.</text>
