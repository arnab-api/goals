<text x="28" y="1075" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" xml:space="preserve" font-weight="400" fill="#647184">Adapted from goal-diff slides 1, 3 and 5. Prompts, code and readouts are shortened schematic examples, not verbatim model outputs.</text>
