[project]
name = "goals-set-count-smoke"
version = "0.0.1"
requires-python = "==3.11.*"
# Targeted environment for the new standalone trainer/tests, not a full goals install.
dependencies = ["torch>=2.7", "transformers>=4.55", "numpy", "pytest", "wandb"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
