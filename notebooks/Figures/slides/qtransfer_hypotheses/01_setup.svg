<text x="96.0" y="656.0" font-family="'IBM Plex Sans', sans-serif" font-size="28" fill="#1f1e1c" font-weight="600">Readout: gaze at the recipient's final ' ='</text>
<text x="96.0" y="700.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">attention × |value| from the pivot to each of the donor's four task descriptions,</text>
<text x="96.0" y="734.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">averaged over the goal heads · the highest-gaze task is the winner</text>
<text x="96.0" y="780.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#e0706b" font-weight="600">Question: which donor task wins, given what the source has already done?</text></svg>