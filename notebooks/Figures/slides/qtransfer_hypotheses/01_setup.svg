<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="mink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1e1c"/></marker><marker id="mmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77736b"/></marker><marker id="msalmon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0706b"/></marker><marker id="mgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f8f5a"/></marker><marker id="mset_diff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="morder_id" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="mcomplete_count" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="minduction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="64.0" y="84.0" font-family="'IBM Plex Sans', sans-serif" font-size="40" fill="#1f1e1c" font-weight="600">Which donor task does a transferred query select?</text>
<text x="64.0" y="124.0" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#77736b">three prompts per run · Qwen2.5-Coder-32B · 250 goal heads · read gaze, no generation</text>
<rect x="64.0" y="236.0" width="432.0" height="310.0" rx="16" fill="#fbe3e1" stroke="#e0706b" stroke-width="2"/>
<text x="92.0" y="290.0" font-family="'IBM Plex Sans', sans-serif" font-size="32" fill="#e0706b" font-weight="600">Source</text>
<text x="92.0" y="326.0" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#77736b">gives the query</text>
<text x="92.0" y="386.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">lists tasks a b c d</text>
<text x="92.0" y="430.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">some are already written</text>
<text x="92.0" y="474.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">query at its final ' =' → q_src</text>
<rect x="584.0" y="236.0" width="432.0" height="310.0" rx="16" fill="#e7f3eb" stroke="#3f8f5a" stroke-width="2"/>
<text x="612.0" y="290.0" font-family="'IBM Plex Sans', sans-serif" font-size="32" fill="#3f8f5a" font-weight="600">KV donor</text>
<text x="612.0" y="326.0" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#77736b">gives the task list</text>
<text x="612.0" y="386.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">lists 4 tasks, only a written</text>
<text x="612.0" y="430.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">its task-list keys/values</text>
<text x="612.0" y="474.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">are copied into the recipient</text>
<rect x="1104.0" y="236.0" width="432.0" height="310.0" rx="16" fill="#f7f6f3" stroke="#1f1e1c" stroke-width="2"/>
<text x="1132.0" y="290.0" font-family="'IBM Plex Sans', sans-serif" font-size="32" fill="#1f1e1c" font-weight="600">Recipient</text>
<text x="1132.0" y="326.0" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="#77736b">is the run we read</text>
<text x="1132.0" y="386.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">lists a x y z, only a written</text>
<text x="1132.0" y="430.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">goal heads read the donor's list</text>
<text x="1132.0" y="474.0" font-family="'IBM Plex Sans', sans-serif" font-size="23" fill="#1f1e1c">and use q_src at its ' ='</text>
